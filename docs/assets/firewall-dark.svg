<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Firewall priority stack. The VPN allow rule at 1000 matches first, the outbound deny at 65534 catches other outbound traffic, and GCP implied rules sit at 65535.">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.p1{animation:p1 8s infinite both}
.p2{animation:p2 8s infinite both}
@keyframes p1{0%{transform:translate(0,-60px);opacity:0}8%{opacity:1}26%,44%{transform:none;opacity:1}50%,100%{transform:none;opacity:0}}
@keyframes p2{0%,48%{transform:translate(0,-126px);opacity:0}54%{opacity:1}66%{transform:translate(0,-66px)}80%,94%{transform:none;opacity:1}100%{transform:none;opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1100" height="360" rx="18" fill="#0F0E1A"/>
<text x="150" y="46" font-size="20" font-weight="700" fill="#FFFFFF">The lowest priority number is evaluated first</text>
<rect x="150" y="74" width="900" height="54" rx="10" fill="#141420" stroke="#00FF99" stroke-width="2"/><text x="176" y="107" font-size="17" font-weight="700" fill="#FFFFFF">1000</text><text x="262" y="107" font-size="17" font-weight="700" fill="#00FF99">ALLOW</text><text x="340" y="107" font-size="15" fill="#C1C2D3">ingress</text><text x="430" y="107" font-size="15" fill="#FFFFFF">VPN source ranges to tcp 22, 3389, 6379</text><text x="1034" y="107" text-anchor="end" font-size="13" fill="#C1C2D3">this repo</text><rect x="150" y="140" width="900" height="54" rx="10" fill="#141420" stroke="#FF5C7A" stroke-width="2"/><text x="176" y="173" font-size="17" font-weight="700" fill="#FFFFFF">65534</text><text x="262" y="173" font-size="17" font-weight="700" fill="#FF5C7A">DENY</text><text x="340" y="173" font-size="15" fill="#C1C2D3">egress</text><text x="430" y="173" font-size="15" fill="#FFFFFF">all destinations, tcp and udp</text><text x="1034" y="173" text-anchor="end" font-size="13" fill="#C1C2D3">this repo</text><rect x="150" y="206" width="900" height="54" rx="10" fill="#141420" stroke="#34344a" stroke-width="2"/><text x="176" y="239" font-size="17" font-weight="700" fill="#C1C2D3">65535</text><text x="262" y="239" font-size="17" font-weight="700" fill="#C1C2D3">DENY</text><text x="340" y="239" font-size="15" fill="#C1C2D3">ingress</text><text x="430" y="239" font-size="15" fill="#C1C2D3">everything else coming in</text><text x="1034" y="239" text-anchor="end" font-size="13" fill="#C1C2D3">implied by GCP</text><rect x="150" y="272" width="900" height="54" rx="10" fill="#141420" stroke="#34344a" stroke-width="2"/><text x="176" y="305" font-size="17" font-weight="700" fill="#C1C2D3">65535</text><text x="262" y="305" font-size="17" font-weight="700" fill="#C1C2D3">ALLOW</text><text x="340" y="305" font-size="15" fill="#C1C2D3">egress</text><text x="430" y="305" font-size="15" fill="#C1C2D3">overridden for tcp and udp by 65534</text><text x="1034" y="305" text-anchor="end" font-size="13" fill="#C1C2D3">implied by GCP</text>
<g class="p1"><circle cx="110" cy="101" r="10" fill="#00FF99"/><text x="110" y="82" text-anchor="middle" font-size="12" fill="#C1C2D3">VPN</text></g>
<g class="p2"><circle cx="110" cy="167" r="10" fill="#FF5C7A"/><text x="110" y="148" text-anchor="middle" font-size="12" fill="#C1C2D3">out</text></g>
</svg>
