<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-label="GKE surge upgrade: five new nodes join first, workloads move, then five old nodes leave. Unavailable nodes stay at zero.">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.old{opacity:.18;animation:old 12s infinite both}
.new{animation:nw 12s infinite both}
.pod{animation:pod 12s infinite both}
.l1,.l2{opacity:0}
.l1{animation:l1 12s infinite both}
.l2{animation:l2 12s infinite both}
.l3{animation:l3 12s infinite both}
@keyframes old{0%,60%{opacity:1}74%,100%{opacity:.18}}
@keyframes nw{0%,12%{opacity:0;transform:translateY(10px)}24%,100%{opacity:1;transform:none}}
@keyframes pod{0%,34%{transform:translateY(-104px)}56%,100%{transform:none}}
@keyframes l1{0%,16%{opacity:1}22%,100%{opacity:0}}
@keyframes l2{0%,18%{opacity:0}24%,62%{opacity:1}68%,100%{opacity:0}}
@keyframes l3{0%,64%{opacity:0}72%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1100" height="340" rx="18" fill="#0F0E1A"/>
<text class="l1" x="550" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5 ready: the upgrade starts</text><text class="l2" x="550" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#38BDF8">10 ready: max_surge 5 adds new nodes, workloads move</text><text class="l3" x="550" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#00FF99">5 ready: every node runs the new version</text>
<g class="old" style="animation-delay:0.00s"><rect x="110" y="96" width="150" height="62" rx="12" fill="#141420" stroke="#C1C2D3"/><text x="185" y="133" text-anchor="middle" font-size="16" fill="#C1C2D3">old node</text></g><g class="old" style="animation-delay:0.12s"><rect x="300" y="96" width="150" height="62" rx="12" fill="#141420" stroke="#C1C2D3"/><text x="375" y="133" text-anchor="middle" font-size="16" fill="#C1C2D3">old node</text></g><g class="old" style="animation-delay:0.24s"><rect x="490" y="96" width="150" height="62" rx="12" fill="#141420" stroke="#C1C2D3"/><text x="565" y="133" text-anchor="middle" font-size="16" fill="#C1C2D3">old node</text></g><g class="old" style="animation-delay:0.36s"><rect x="680" y="96" width="150" height="62" rx="12" fill="#141420" stroke="#C1C2D3"/><text x="755" y="133" text-anchor="middle" font-size="16" fill="#C1C2D3">old node</text></g><g class="old" style="animation-delay:0.48s"><rect x="870" y="96" width="150" height="62" rx="12" fill="#141420" stroke="#C1C2D3"/><text x="945" y="133" text-anchor="middle" font-size="16" fill="#C1C2D3">old node</text></g><g class="new" style="animation-delay:0.00s"><rect x="110" y="226" width="150" height="62" rx="12" fill="#141420" stroke="#00FF99" stroke-width="2"/><text x="185" y="263" text-anchor="middle" font-size="16" fill="#00FF99">new node</text></g><g class="new" style="animation-delay:0.12s"><rect x="300" y="226" width="150" height="62" rx="12" fill="#141420" stroke="#00FF99" stroke-width="2"/><text x="375" y="263" text-anchor="middle" font-size="16" fill="#00FF99">new node</text></g><g class="new" style="animation-delay:0.24s"><rect x="490" y="226" width="150" height="62" rx="12" fill="#141420" stroke="#00FF99" stroke-width="2"/><text x="565" y="263" text-anchor="middle" font-size="16" fill="#00FF99">new node</text></g><g class="new" style="animation-delay:0.36s"><rect x="680" y="226" width="150" height="62" rx="12" fill="#141420" stroke="#00FF99" stroke-width="2"/><text x="755" y="263" text-anchor="middle" font-size="16" fill="#00FF99">new node</text></g><g class="new" style="animation-delay:0.48s"><rect x="870" y="226" width="150" height="62" rx="12" fill="#141420" stroke="#00FF99" stroke-width="2"/><text x="945" y="263" text-anchor="middle" font-size="16" fill="#00FF99">new node</text></g><circle class="pod" style="animation-delay:0.00s" cx="185" cy="214" r="7" fill="#38BDF8"/><circle class="pod" style="animation-delay:0.12s" cx="375" cy="214" r="7" fill="#38BDF8"/><circle class="pod" style="animation-delay:0.24s" cx="565" cy="214" r="7" fill="#38BDF8"/><circle class="pod" style="animation-delay:0.36s" cx="755" cy="214" r="7" fill="#38BDF8"/><circle class="pod" style="animation-delay:0.48s" cx="945" cy="214" r="7" fill="#38BDF8"/>
<text x="550" y="322" text-anchor="middle" font-size="15" fill="#C1C2D3">max_unavailable 0: no node leaves until its replacement is ready</text>
</svg>
